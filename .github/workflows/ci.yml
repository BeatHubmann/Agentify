# Thin orchestration over the repository's own check commands (A§26.6).
# Actions are pinned to full commit SHAs; the workflow has read-only permissions and no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format
        run: make format
      - name: Lint
        run: make lint
      - name: Types
        run: make types
      - name: Import contracts
        run: make imports
      - name: Tests (unit, property, orchestration, failure, api; real Postgres and MinIO containers)
        run: make test

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  spelling:
    name: spell check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  aislop:
    name: aislop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AISLOP_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the pinned aislop CLI (lockfile, no lifecycle scripts)
        working-directory: tools/aislop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: aislop quality gate (fails on any error finding or a score below .aislop/config.yml failBelow)
        run: ./tools/aislop/node_modules/.bin/aislop ci --human
